<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Faiz Hesaplama — Son Çevrimiçi Sürüm</title>
</head>
<body>
  <p>En son çevrimiçi sürüm bulunuyor…</p>
  <script>
    (async () => {
      const status = document.querySelector('p');

      const normalizeName = (name) => name
        .toLocaleLowerCase('tr-TR')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/ı/g, 'i')
        .replace(/[^a-z0-9]/g, '');

      try {
        const response = await fetch('https://api.github.com/repos/ferhatbkr/tcmb_reeskont_faizi/releases/latest', {
          headers: { 'Accept': 'application/vnd.github+json' }
        });
        if (!response.ok) throw new Error(`GitHub API: ${response.status}`);

        const release = await response.json();
        const asset = release.assets.find(a => {
          const normalized = normalizeName(a.name);
          return normalized.includes('cevrimici') && normalized.endsWith('xlsx');
        });

        if (!asset) throw new Error('Çevrimiçi XLSX dosyası bulunamadı.');
        window.location.replace(asset.browser_download_url);
      } catch (error) {
        status.textContent = 'En son çevrimiçi sürüm bulunamadı.';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
