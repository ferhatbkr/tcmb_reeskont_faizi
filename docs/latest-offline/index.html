<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Faiz Hesaplama — Son Çevrimdışı Sürüm</title>
</head>
<body>
  <p>En son çevrimdışı sürüm bulunuyor…</p>
  <script>
    (async () => {
      const status = document.querySelector('p');
      try {
        const response = await fetch('https://api.github.com/repos/ferhatbkr/tcmb_reeskont_faizi/releases/latest', {
          headers: { 'Accept': 'application/vnd.github+json' }
        });
        if (!response.ok) throw new Error(`GitHub API: ${response.status}`);

        const release = await response.json();
        const asset = release.assets.find(a =>
          a.name.toLocaleLowerCase('tr-TR').includes('çevrimdışı') &&
          a.name.toLocaleLowerCase('tr-TR').endsWith('.xlsx')
        );

        if (!asset) throw new Error('Çevrimdışı XLSX dosyası bulunamadı.');
        window.location.replace(asset.browser_download_url);
      } catch (error) {
        status.textContent = 'En son çevrimdışı sürüm bulunamadı.';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
