name: Günlük faiz kontrolü

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Bağımlılıkları kur
        run: python -m pip install --upgrade pip pandas lxml

      - name: Faiz verisini kontrol et
        run: python scripts/update_faiz.py

      - name: Değişiklikleri kontrol et ve durum dosyasını güncelle
        shell: bash
        run: |
          if git diff --quiet -- faizler.txt; then
            echo "Faiz verisinde değişiklik yok. Commit yapılmayacak."
            exit 0
          fi

          python - <<'PY'
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          path = Path("status.txt")
          now = datetime.now(ZoneInfo("Europe/Istanbul")).replace(microsecond=0).isoformat()
          path.write_text(f"last_update={now}\n", encoding="utf-8")
          PY

      - name: Değişiklikleri commit et ve gönder
        shell: bash
        run: |
          if git diff --quiet -- faizler.txt status.txt; then
            echo "Commit gerektiren değişiklik yok."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add faizler.txt status.txt
          git commit -m "Günlük faiz verisi güncellemesi"
          git push
