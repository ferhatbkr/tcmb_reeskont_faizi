name: Günlük faiz kontrolü

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Bağımlılıkları kur
        run: python -m pip install --upgrade pip pandas lxml

      - name: Faiz verisini kontrol et
        run: python scripts/update_faiz.py

      - name: Durum dosyasını güncelle
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("status.txt")
          content = path.read_text(encoding="utf-8") if path.exists() else ""
          values = {}
          for line in content.splitlines():
              if "=" in line:
                  key, value = line.split("=", 1)
                  values[key.strip()] = value.strip()

          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          values["last_check"] = now

          if Path("faizler.txt").exists():
              import subprocess
              changed = subprocess.run(
                  ["git", "diff", "--quiet", "--", "faizler.txt"],
                  check=False,
              ).returncode != 0
              if changed:
                  values["last_update"] = now

          path.write_text(
              f"last_check={values.get('last_check', '')}\n"
              f"last_update={values.get('last_update', '')}\n",
              encoding="utf-8",
          )
          PY

      - name: Değişiklikleri commit et ve gönder
        shell: bash
        run: |
          if git diff --quiet -- faizler.txt status.txt; then
            echo "Commit gerektiren değişiklik yok."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add faizler.txt status.txt
          git commit -m "Günlük faiz verisi kontrolü"
          git push
