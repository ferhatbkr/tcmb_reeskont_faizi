name: Haftalık repository aktivitesi

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activity:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Aktivite tarihini güncelle
        shell: bash
        run: |
          printf 'last_activity=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > heartbeat.txt

      - name: Değişikliği commit et ve gönder
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heartbeat.txt
          git commit -m "Haftalık repository aktivitesi"
          git push
